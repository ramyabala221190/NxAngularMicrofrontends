<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <span class="navbar-brand">Happy Shopping</span>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            [routerLinkActiveOptions]="{exact: true}"
            [routerLinkActive]="['activeTab']"
            [routerLink]="['products']"
            >Products</a
          >
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            [routerLinkActiveOptions]="{exact: true}"
            [routerLinkActive]="['activeTab']"
            [routerLink]="['carts']"
          >
            <i class="bi bi-bag-fill"></i>My Cart
            <span class="badge text-bg-danger"
              >{{cartDetail().products.length}}</span
            ></a
          >
        </li>
        <li class="nav-item" *ngIf="!isAuthenticated()">
          <a
            class="nav-link"
            href="#"
            [routerLinkActive]="['activeTab']"
            [routerLink]="['login']"
            ><i class="bi bi-box-arrow-in-right"></i>Login</a
          >
        </li>
        <li
          class="nav-item dropdown"
          *ngIf="isAuthenticated() && user() as userDetail"
        >
          <a
            class="nav-link dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-person-circle"
              viewBox="0 0 16 16"
            >
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
              <path
                fill-rule="evenodd"
                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"
              />
            </svg>
            <span>{{userDetail.firstName}} {{userDetail.lastName}}</span>
          </a>
          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" (click)="logout()"
                ><i class="bi bi-box-arrow-left"></i>Logout</a
              >
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
