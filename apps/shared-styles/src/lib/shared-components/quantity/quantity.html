<div class="quantity-update">
  <button class="btn btn-sm" (click)="decreaseQuantity()">-</button>
  <div class="quantity-update-controls">
    <span class="content-label">Quantity</span>
    <span class="content">{{quantity}}</span>
  </div>
  <button class="btn btn-sm" (click)="increaseQunatity()">+</button>
</div>
